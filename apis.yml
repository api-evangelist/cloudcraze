aid: cloudcraze
name: CloudCraze
description: >-
  CloudCraze was an enterprise B2B commerce platform built natively on the
  Salesforce Platform, letting businesses launch online B2B storefronts fast and
  scale them on top of Salesforce CRM data. Brands including Coca-Cola, Cummins,
  Ecolab, Land O' Lakes, and WABCO ran global B2B commerce on it. Salesforce
  acquired CloudCraze in 2018 and folded it into the Salesforce B2B Commerce
  product line (now the legacy "B2B Commerce for Visualforce" managed package),
  where its Apex/JavaScript developer surface continues to be documented on
  Salesforce Developers. CloudCraze no longer operates as an independent company
  or developer portal — www.cloudcraze.com redirects to Salesforce B2B Commerce.
